name: usage-stats

# Captures GitHub traffic (14-day rolling window) and skills.sh install
# counters into stats/ before the window rolls off. Weekly cadence against a
# 14-day window gives 2x overlap safety.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check TRAFFIC_TOKEN
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "$TRAFFIC_TOKEN" ]; then
            echo "::error::TRAFFIC_TOKEN secret is not set. Traffic API endpoints need a PAT with push access to this repo (the built-in GITHUB_TOKEN returns 403). Create a fine-grained PAT (Administration: read, Contents: read) and add it with: gh secret set TRAFFIC_TOKEN -R ${{ github.repository }}"
            exit 1
          fi

      - name: Collect stats
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: ./scripts/collect_traffic_stats.sh

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "stats: weekly traffic snapshot"
            git push
          fi
